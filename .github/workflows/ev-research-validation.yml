name: EV research branch validation

on:
  push:
    branches:
      - research/ev-calibration-audit-2026-10-25

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: EV and chart-feature regression tests
        run: node --import tsx --test scripts/waterx-ev-evidence.test.ts scripts/waterx-price-path-features.test.ts scripts/bluewater-research.test.ts
