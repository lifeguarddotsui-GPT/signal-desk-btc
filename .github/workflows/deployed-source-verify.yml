name: Blue Water deployed-source verification
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: source-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    name: Read-only typecheck tests build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Bounded full regression suite (never hang)
        run: timeout --signal=TERM --kill-after=5s 120s npm test
      - name: Production build (never deploy)
        if: always()
        run: npm run build
