name = "waterx-edge-prototype"
main = "worker.ts"
compatibility_date = "2026-09-30"
account_id = "4678f8b0217c6f3eb3e96cb59846b17f"
workers_dev = true

# Isolated source-only Free-tier trial. Not the production trading database.
# The collector automatically stops 26h after its first cron bootstrap.
[[d1_databases]]
binding = "DB"
database_name = "waterx-edge-prototype"
database_id = "52803744-2abd-4ee7-8435-032f27d331a3"
migrations_dir = "."

[[durable_objects.bindings]]
name = "WATERX_COLLECTOR"
class_name = "WaterxCollector"

[exports.WaterxCollector]
type = "durable-object"
storage = "sqlite"

[observability]
enabled = true
head_sampling_rate = 1

# One-minute bootstrap/watchdog. The DO owns the ~5-second polling cadence.
[triggers]
crons = ["* * * * *"]