name: WaterX external availability
on:
  workflow_dispatch:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
permissions:
  contents: read
  issues: write
concurrency:
  group: waterx-external-availability
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check web liveness and both WaterX intervals
        env:
          WATERX_MONITOR_URL: https://bluewaterai.app
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-waterx-availability.mjs