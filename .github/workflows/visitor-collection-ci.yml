name: Visitor-only Blue Water checks
on:
  pull_request:
    paths:
      - "server/**"
      - "client/**"
      - "shared/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/visitor-collection-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visitor-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: timeout 45s node --import tsx --test scripts/visitor-activity.test.ts
      - run: timeout 45s node --import tsx --test scripts/visitor-http.test.ts
  complete-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: timeout 180s npm test
