name: One-shot copy of pinned public production source (GitHub only)

on:
  pull_request:
    paths:
      - ".github/workflows/sync-deployed-source-once.yml"

permissions:
  contents: write

jobs:
  source_snapshot:
    name: Import public source to isolated sync branch (NO DEPLOY)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout isolated sync branch
        uses: actions/checkout@v4
        with:
          ref: sync/production-source-20261009
          persist-credentials: true
      - name: Fetch pinned, already-public source-only archive and overlay allowlisted paths
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 40 --max-filesize 2000000 --output /tmp/live.tar.gz https://bluewaterai.app/source-release.tar.gz
          echo '444d97a454b0c5704956bc248b6f71b9c2d937ea7fc724187cff42d6ec051c30  /tmp/live.tar.gz' | sha256sum --check --status
          python3 - <<'PY'
          import pathlib, tarfile, shutil
          archive='/tmp/live.tar.gz'
          root=pathlib.Path.cwd()
          source_dirs={'client','server','shared','edge','migrations','scripts','script','infrastructure'}
          source_files={'RELEASE.json','package.json','package-lock.json','.npmrc','tsconfig.json','vite.config.ts','vite.config.js','postcss.config.js','postcss.config.ts','drizzle.config.ts','components.json','index.html','README.md','LICENSE'}
          count=total=0
          with tarfile.open(archive,'r:gz') as tf:
              for m in tf:
                  raw=m.name.removeprefix('./')
                  path=pathlib.PurePosixPath(raw)
                  if not raw or path.is_absolute() or '..' in path.parts:
                      raise ValueError('Refuse unsafe archive path')
                  if m.isdir(): continue
                  if not m.isfile():
                      raise ValueError('Refuse non-regular archive member')
                  if path.parts[0] not in source_dirs and raw not in source_files:
                      continue
                  if m.size>350000: raise ValueError('Refuse unexpectedly large single source file')
                  count+=1;total+=m.size
                  if count>1000 or total>12000000: raise ValueError('Refuse oversized source export')
                  dest=root.joinpath(*path.parts)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  with tf.extractfile(m) as source, open(dest,'wb') as out:
                      shutil.copyfileobj(source,out)
          print(f'Safe source-only files imported: {count}; bytes: {total}')
          PY
          git config user.name "bluewater-source-audit[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .\n          git restore --staged -- .github 2>/dev/null || true
          git diff --cached --stat | tail -n 25
          if git diff --cached --quiet; then
            echo "Pinned public source matches selected paths; no commit needed."
          else
            git commit -m "Audit snapshot: deployed source 09c0f4c (2026-10-08), no production changes"
            git push origin HEAD:refs/heads/sync/production-source-20261009
          fi
