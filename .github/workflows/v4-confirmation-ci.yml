name: V4 Confirmation targeted safeguards
on:
  pull_request:
    paths:
      - "shared/confirmation-v4.ts"
      - "server/waterx/confirmation-v4-shadow.ts"
      - "server/waterx/confirmation-v4-compare.ts"
      - "server/waterx/live-observation.ts"
      - "server/routes.ts"
      - "scripts/confirmation-v4.test.ts"
      - "scripts/replit-approved-git-sync.sh"
      - ".github/workflows/v4-confirmation-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run check
      - name: Isolated V4 regression
        run: timeout --signal=TERM --kill-after=5s 45s node --import tsx --test scripts/confirmation-v4.test.ts
      - name: Validate source-only Replit sync script
        run: bash -n scripts/replit-approved-git-sync.sh
      - name: Production build without deployment
        run: npm run build
